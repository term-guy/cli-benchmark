[project]
name = "cli-benchmark"
version = "0.1.0"
description = "Linux server performance benchmark tool"
requires-python = ">=3.8"
dependencies = [
    "rich>=13.0",
]

[project.scripts]
cli-benchmark = "bench:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["bench.py", "benchmarks/"]
